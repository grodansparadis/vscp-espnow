name: Build Alpha ESP32

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VSCP_FIRMWARE: ./vscp-firmware/
  VSCP_FIRMWARE_COMMON: ./vscp-firmware/common/

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: test
      run: echo $VSCP_FIRMWARE
      
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1.2
      with:
        esp_idf_version: latest
        target: esp32
        path: './firmware/alpha/'
    
    - name: Write SHA256SUMS
      id: sha256sums_31
      continue-on-error: true
      shell: bash
      run: |
        bash "${GITHUB_WORKSPACE//\\//}/.github/scripts/write-sha256sums.sh" "SHA256SUMS-vscp_espnow_alpha.bin" <<'SHA256SUMS_PATTERNS'
        ./firmware/alpha/build/vscp_espnow_alpha.bin
        SHA256SUMS_PATTERNS

    - uses: actions/upload-artifact@v4
      with:
        name: vscp_espnow_alpha.bin
        path: |
          ./firmware/alpha/build/vscp_espnow_alpha.bin
          ${{ steps.sha256sums_31.outputs.file }}
        retention-days: 7