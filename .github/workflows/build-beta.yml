name: Build Beta ESP32

on: [push]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
  
    - name: esp-idf build
      uses: espressif/esp-idf-ci-action@v1
      with:
        esp_idf_version: latest
        target: esp32
        path: './firmware/beta/'
    
    - name: Write SHA256SUMS
      id: sha256sums_26
      continue-on-error: true
      shell: bash
      run: |
        bash .github/scripts/write-sha256sums.sh "SHA256SUMS-vscp_espnow_beta.bin" <<'SHA256SUMS_PATTERNS'
        ./firmware/beta/build/vscp_espnow_beta.bin
        SHA256SUMS_PATTERNS

    - uses: actions/upload-artifact@v4
      with:
        name: vscp_espnow_beta.bin
        path: |
          ./firmware/beta/build/vscp_espnow_beta.bin
          ${{ steps.sha256sums_26.outputs.file }}
        retention-days: 7